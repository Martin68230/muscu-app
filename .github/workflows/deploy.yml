# Teste puis publie l'app sur GitHub Pages à chaque envoi sur main (gratuit pour un dépôt public).
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet pour la recherche de secrets
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Secrets dans l'historique, fonctions dangereuses (XSS), dépendances vulnérables : bloquant.
      - run: npm run check:securite
      # Format des fiches d'exercices : non bloquant tant que les fiches ne sont pas conformes (à rendre bloquant ensuite).
      - run: npm run check:fiches
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
